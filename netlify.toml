# Site statique : aucune commande de build, on publie le dépôt tel quel.
[build]
  publish = "."
  command = ""

# L'ancienne adresse de la vitrine renvoie vers la nouvelle.
[[redirects]]
  from = "/outils/galerie.html"
  to = "/vitrine/"
  status = 301

# Les fichiers source de l'API et des tests ne sont pas des pages publiques.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
