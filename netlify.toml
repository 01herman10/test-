# Site statique : aucune commande de build, on publie le dépôt tel quel.
[build]
  publish = "."
  command = ""
  # Chaque mise en ligne coûte des crédits Netlify (15 sur 300 par mois en offre gratuite).
  # On ne remet pas le site en ligne quand seuls les tests, scripts, README ou réglages GitHub changent.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)scripts' ':(exclude)tests' ':(exclude)README.md' ':(exclude).github'"

# L'ancienne adresse de la vitrine renvoie vers la nouvelle.
[[redirects]]
  from = "/outils/galerie.html"
  to = "/vitrine/"
  status = 301

# Les anciens outils ont quitté ce site : leurs anciens liens ramènent au calculateur.
[[redirects]]
  from = "/outils/*"
  to = "/"
  status = 301

# Les fichiers source de l'API et des tests ne sont pas des pages publiques.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
