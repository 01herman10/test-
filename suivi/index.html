<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Suivi des demandes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Tableau de bord privé : une carte par demande, la plus récente en haut */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#15232A; --muted:#566870; --line:#D2DBDA;
  --accent:#0D5A66; --accent-ink:#FFFFFF; --mark:#F2C230; --mark-ink:#15232A;
  --danger:#B3261E; --danger-bg:#FBE8E6; --ok:#1E7448; --ok-bg:#E5F3EB; --warn:#7A4B00; --warn-bg:#FCEFD2; --wa:#1F8A4C;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1618; --surface:#162226; --ink:#E5ECEB; --muted:#93A5A9; --line:#2A3B40; --accent:#62B6C3; --accent-ink:#0E1618;
  --mark:#E8B829; --danger:#F28A80; --danger-bg:#3A1D1B; --ok:#62C792; --ok-bg:#16301F; --warn:#F0C46A; --warn-bg:#352A12; --wa:#4CC77E; color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
button,.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.wa{background:var(--wa);color:#fff}.btn.sec,button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{border-radius:8px;padding:10px 14px;margin:0}.msg.bad{background:var(--danger-bg);color:var(--danger)}.msg.info{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.compteurs{display:flex;gap:8px;flex-wrap:wrap}
.compteurs span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.compteurs b{font-family:var(--f-mono)}
.tete{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.tete b{font-family:var(--f-display);font-size:18px}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.pill.refusee{background:var(--danger-bg);color:var(--danger)}.pill.acceptee,.pill.neuf{background:var(--ok-bg);color:var(--ok)}.pill.autre{background:var(--warn-bg);color:var(--warn)}
.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px;font-size:14px}
.infos div span{display:block;color:var(--muted);font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.citation{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin:0}
.fine{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Espace privé · Douane Afrique</div>
    <h1>Suivi des demandes de vérification</h1>
  </header>

  <section class="card" id="connexion">
    <label for="cle">Clé d'accès</label>
    <div class="row"><input type="password" id="cle" autocomplete="current-password" style="flex:1"><button id="entrer">Ouvrir</button></div>
    <p class="fine">La clé reste enregistrée sur cet appareil seulement.</p>
  </section>

  <div id="tableau" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="compteurs" id="compteurs"></div>
      <div class="row"><button class="sec" id="rafraichir">Actualiser</button><button class="sec" id="sortir">Se déconnecter</button></div>
    </div>
    <p class="msg info" id="vide" hidden>Aucune demande pour l'instant. Elles apparaîtront ici dès qu'un client remplira le formulaire « Faire vérifier mon véhicule ».</p>
    <div id="liste" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
  <p class="msg bad" id="erreur" hidden></p>
</div>

<script>
var CLE_LOCALE = "douane-afrique-cle";
var $ = function (id) { return document.getElementById(id); };
var statuts = {};
function lireCle() { try { return localStorage.getItem(CLE_LOCALE) || ""; } catch (e) { return ""; } }
function ecrireCle(v) { try { v ? localStorage.setItem(CLE_LOCALE, v) : localStorage.removeItem(CLE_LOCALE); } catch (e) {} }
var cle = lireCle();
function api(chemin, options) {
  options = options || {};
  options.headers = Object.assign({ Authorization: "Bearer " + cle }, options.headers || {});
  return fetch(chemin, options).then(function (r) {
    if (r.status === 401) throw new Error("Clé d'accès incorrecte.");
    if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.erreur || ("Erreur " + r.status)); });
    return r;
  });
}
function erreur(m) { $("erreur").textContent = m; $("erreur").hidden = !m; }
function fcfa(n) { return Math.round(n).toLocaleString("fr-FR") + " FCFA"; }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function carte(d) {
  var c = el("article", "card");
  var tete = el("div", "tete");
  var titre = el("b", null, [d.vehicule.modele, d.vehicule.annee].filter(Boolean).join(" ") || "Véhicule");
  tete.appendChild(titre);
  tete.appendChild(el("span", "date", new Date(d.recueLe).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" })));
  c.appendChild(tete);

  var ligne = el("div", "row");
  var s = d.estimation ? d.estimation.age.statut : "autre";
  var libelle = { refusee: "Risque de refus", acceptee: "Âge accepté", neuf: "Neuf", limite_inconnue: "Limite à confirmer", annee_manquante: "Année manquante", autre: "À vérifier" }[s] || "À vérifier";
  ligne.appendChild(el("span", "pill " + (s === "refusee" || s === "acceptee" || s === "neuf" ? s : "autre"), libelle));
  var sel = el("select"); sel.setAttribute("aria-label", "Statut de la demande");
  Object.keys(statuts).forEach(function (k) { var o = el("option", null, statuts[k]); o.value = k; sel.appendChild(o); });
  sel.value = d.statut;
  sel.addEventListener("change", function () {
    api("/api/demandes/" + d.id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ statut: sel.value }) })
      .then(charger).catch(function (e) { erreur(e.message); });
  });
  ligne.appendChild(sel);
  c.appendChild(ligne);

  var infos = el("div", "infos");
  [["Client", d.client.nom], ["WhatsApp", d.client.whatsapp], ["E-mail", d.client.email || "—"], ["Destination", d.paysNom || d.paysDestination], ["Véhicule en", d.vehicule.paysAchat], ["Prix annoncé", d.vehicule.prixTexte || "—"],
   ["Taxes estimées", d.estimation && d.estimation.prixLu ? fcfa(d.estimation.total) : "—"]].forEach(function (x) {
    var dv = el("div"); dv.appendChild(el("span", null, x[0])); dv.appendChild(document.createTextNode(x[1] || "—")); infos.appendChild(dv);
  });
  c.appendChild(infos);
  if (d.estimation) c.appendChild(el("p", "fine", d.estimation.phraseAge));
  if (d.remarque) c.appendChild(el("p", "fine", d.remarque));
  if (d.message) { c.appendChild(el("span", "fine", "Question du client :")); c.appendChild(el("p", "citation", d.message)); }

  var actions = el("div", "row");
  var wa = el("a", "btn wa", "Répondre sur WhatsApp"); wa.href = d.lienWhatsApp; wa.target = "_blank"; wa.rel = "noopener";
  actions.appendChild(wa);
  if (d.vehicule.lienAnnonce) { var an = el("a", "btn sec", "Voir l'annonce"); an.href = d.vehicule.lienAnnonce; an.target = "_blank"; an.rel = "noopener noreferrer"; actions.appendChild(an); }
  var rap = el("button", "sec", "Rapport (PDF)");
  rap.addEventListener("click", function () {
    var fen = window.open("", "_blank");
    api("/api/demandes/" + d.id + "/rapport").then(function (r) { return r.text(); }).then(function (html) {
      var url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      if (fen) fen.location = url; else location.href = url;
    }).catch(function (e) { if (fen) fen.close(); erreur(e.message); });
  });
  actions.appendChild(rap);
  c.appendChild(actions);

  var notes = el("textarea"); notes.value = d.notes || ""; notes.placeholder = "Notes (tarif proposé, rendez-vous, transitaire…)"; notes.setAttribute("aria-label", "Notes");
  notes.addEventListener("change", function () {
    api("/api/demandes/" + d.id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notes: notes.value }) }).catch(function (e) { erreur(e.message); });
  });
  c.appendChild(notes);
  return c;
}

function charger() {
  erreur("");
  return api("/api/demandes").then(function (r) { return r.json(); }).then(function (j) {
    statuts = j.statuts;
    $("connexion").hidden = true; $("tableau").hidden = false;
    var cpt = $("compteurs"); cpt.innerHTML = "";
    var t = el("span"); t.appendChild(document.createTextNode("Total ")); t.appendChild(el("b", null, String(j.total))); cpt.appendChild(t);
    Object.keys(statuts).forEach(function (k) {
      var n = j.demandes.filter(function (d) { return d.statut === k; }).length;
      if (!n) return; var s = el("span"); s.appendChild(document.createTextNode(statuts[k] + " ")); s.appendChild(el("b", null, String(n))); cpt.appendChild(s);
    });
    $("vide").hidden = j.total > 0;
    var l = $("liste"); l.innerHTML = ""; j.demandes.forEach(function (d) { l.appendChild(carte(d)); });
  }).catch(function (e) {
    erreur(e.message);
    if (/Clé/.test(e.message)) { ecrireCle(""); cle = ""; $("connexion").hidden = false; $("tableau").hidden = true; }
  });
}

$("entrer").addEventListener("click", function () { cle = $("cle").value.trim(); if (!cle) return; ecrireCle(cle); charger(); });
$("cle").addEventListener("keydown", function (e) { if (e.key === "Enter") $("entrer").click(); });
$("rafraichir").addEventListener("click", charger);
$("sortir").addEventListener("click", function () { ecrireCle(""); cle = ""; location.reload(); });
if (cle) charger();
</script>
</body>
</html>
