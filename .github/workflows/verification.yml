# Vérifie à chaque envoi que tous les liens et fichiers utilisés par les pages existent bien.
name: Vérification du site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/verifier-liens.mjs
      - name: Tests des règles douanières et de l'API
        run: node --test tests/*.test.js
